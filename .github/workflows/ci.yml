name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # whole history: a key deleted later is still in old commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the locked, hashed dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint-test]            # don't spend time building code that fails its tests
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t pm25:ci .